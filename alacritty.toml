[general]
working_directory = "C:\\"

[window]
padding = {
    x = 1,
    # y = 10
}
opacity = 0.95
# blur = true
decorations = "None"
startup_mode = "Maximized"

[font]
size = 9
normal = {
    # family = "BlexMono Nerd Font"
    # family = "GeistMono Nerd Font"
    # family = "Iosevka Nerd Font Mono"
    # family = "Lilex Nerd Font Mono"
    # family = "FiraCode Nerd Font Mono"
    # family = "DepartureMono Nerd Font"
    # family = "JetBrainsMono Nerd Font"
    family = "FiraCode Nerd Font Mono",
    style = "Regular"

}

[colors]
cursor = {
    # text = "#ffffff",
    # cursor = "#ff69b4"
}

[cursor]
style = {
    # shape = "Block",
    blinking = "Always"
}
blink_interval = 300
blink_timeout = 0
# thickness = 1.0

[mouse]
hide_when_typing = true

[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "CreateNewWindow"
